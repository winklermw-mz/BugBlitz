{% extends "base.html" %}
{% block content %}
<h2>Benutzerverwaltung</h2>
<div class="row">
    <div class="col-md-4">
        <form method="POST" class="card p-3">
            <h5>Neuer Benutzer</h5>
            <input type="text" name="username" placeholder="Username" class="form-control mb-2" required>
            <input type="text" name="email" placeholder="E-Mail" class="form-control mb-2" required>
            <input type="password" name="password" placeholder="Passwort" class="form-control mb-2" required>
            <input type="password" name="password_repeat" placeholder="Passwort wiederholen" class="form-control mb-2" required>
            <label class="form-label">Rollen:</label>
            {% for role in all_roles %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="roles" value="{{ role.name }}" id="role_{{role.id}}">
                <label class="form-check-label" for="role_{{role.id}}">{{ role.name }}</label>
            </div>
            {% endfor %}
            <button type="submit" name="create" class="btn btn-success mt-2">Erstellen</button>
        </form>
    </div>
    <div class="col-md-8">
        <table class="table bg-white">
            <thead><tr><th>User</th><th>Rollen</th><th>Aktion</th></tr></thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u.username }}</td>
                    <td>
                        {% for r in u.roles %}<span class="badge bg-secondary">{{ r.name }}</span> {% endfor %}
                    </td>
                    <td>
                        {% if u.username != 'admin' %}
                        <form method="POST" style="display:inline;" onsubmit="return confirm('Wirklich löschen?');">
                            <input type="hidden" name="user_id" value="{{ u.id }}">
                            <button type="submit" name="delete" class="btn btn-sm btn-danger">Löschen</button>
                        </form>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
